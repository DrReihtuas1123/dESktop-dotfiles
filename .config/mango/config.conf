###########################################
###              Startup                ###
###########################################

# bar (Waybar)
exec_once=waybar

# Set wallpaper
exec_once=swaybg -i ~/.config/planet.png -m fill

# Redshift
exec_once=gammastep -l 46.94700000:7.44500000 -t 6500:3500 
# w/ coordinates of the BNS

# Notifications
exec_once=mako

# Backups
exec_once=deja-dup

# idle
exec_once=swayidle -w timeout 180 swaylock before-sleep swaylock

###########################################
###              Keyboard               ###
###########################################

repeat_rate=30
repeat_delay=500
numlock_on=0
xkb_rules_layout=ch
xkb_rules_variant=fr
# Mapping caps-locks to escape for vim
xkb_rules_options= caps:escape

###########################################
###              Trackpad               ###
###########################################
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
mouse_left_handed=0
mouse_middle_button_emulation=0
swipe_min_threshold=1

###########################################
###               Mouse                 ###
###########################################
# need relogin to make it apply
mouse_natural_scrolling=0

###########################################
###              Monitors               ###
###########################################

# Laptop display:60Hz, no rotation
monitor_rule=name:eDP-1,scale:1,x:0,y:0,width:1920,height:1200,refresh:60

# External monitor: 1440p, 144Hz, positioned to the right
monitor_rule=name:HDMI-A-1,scale:1,x:1920,y:0,width:2560,height:1440,refresh:144

###########################################
###            Window Rules             ###
###########################################

# Free42 calculator
window_rule=width:500,height:900,is_floating:1,app_id:free42

###########################################
###               imports               ###
###########################################

# Appearance config
source=~/.config/mango/appearance.conf

# Keybindings
source=~/.config/mango/keybinds.conf

